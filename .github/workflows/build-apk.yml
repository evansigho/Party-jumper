name: Build Party Jumper APK

# Runs every time you upload or change files, or when you press "Run workflow" on the Actions tab.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Lets you upload the project as ONE zip file (easy from a phone). It gets unpacked here.
      - name: Unpack project zip (if uploaded as a zip)
        run: |
          if [ ! -f package.json ]; then
            Z=$(ls *.zip | head -1)
            unzip -q -o "$Z" -d _src
            D=$(dirname "$(find _src -name package.json -not -path '*/node_modules/*' | head -1)")
            shopt -s dotglob
            cp -r "$D"/* .
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # GitHub's build computers already include the Android SDK; just accept its licences.
      - name: Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install
        run: npm ci || npm install

      - name: Copy the game into the Android app
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../PartyJumper.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PartyJumper-apk
          path: PartyJumper.apk

      # Puts the APK on the repo's Releases page so you can download it straight onto your phone.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Party Jumper build ${{ github.run_number }}
          body: Install PartyJumper.apk on Android. New builds install over old ones and keep your saved progress.
          files: PartyJumper.apk
